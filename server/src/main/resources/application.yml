server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8090}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 128KB
spring:
  application:
    name: piaochu-server
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/piaochu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
app:
  demo-data: ${DEMO_DATA:true}
  operator:
    username: ${OPERATOR_USERNAME:}
    password: ${OPERATOR_PASSWORD:}
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-startup}] %logger{35} - %msg%n"
